<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="extName">Playlist Looper for Netflix</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Teksty pochodzą z _locales/<język>/messages.json (atrybuty data-i18n*). Angielskie są tylko domyślną treścią. -->
  <header>
    <h1><span class="icon" data-icon="repeat" aria-hidden="true"></span> Playlist Looper</h1>
    <div class="controls">
      <button id="prev" data-i18n-title="prev" data-i18n-aria-label="prev"><span class="icon" data-icon="backward-step" aria-hidden="true"></span></button>
      <button id="toggle" class="primary"><span class="icon" data-icon="play" aria-hidden="true"></span><span class="label">Start</span></button>
      <button id="next" data-i18n-title="next" data-i18n-aria-label="next"><span class="icon" data-icon="forward-step" aria-hidden="true"></span></button>
    </div>
  </header>

  <section class="add">
    <button id="add-current" disabled><span class="icon" data-icon="plus" aria-hidden="true"></span><span class="label">Add current title</span></button>
    <form id="add-form">
      <input id="add-input" data-i18n-placeholder="addInputPlaceholder" autocomplete="off">
      <button type="submit" data-i18n="add">Add</button>
    </form>
  </section>

  <p id="status" role="status"></p>

  <ol id="list"></ol>
  <p id="empty" hidden data-i18n="emptyList">The playlist is empty.</p>

  <details>
    <summary data-i18n="settings">Settings</summary>
    <label><span data-i18n="mode">Mode</span>
      <select id="loopMode">
        <option value="all" data-i18n="modeAll">Loop the whole list</option>
        <option value="one" data-i18n="modeOne">Loop a single item</option>
        <option value="off" data-i18n="modeOff">Play once and stop</option>
      </select>
    </label>
    <label class="row"><input type="checkbox" id="shuffle"> <span data-i18n="shuffle">Shuffle</span></label>
    <label class="row"><input type="checkbox" id="fullscreen"> <span data-i18n="fullscreenOption">Fullscreen during the loop</span></label>
    <small data-i18n="fullscreenHint"></small>
    <label><span data-i18n="skipBefore">Move on</span> <input type="number" id="creditsOffset" min="0" max="900" step="1"> <span data-i18n="skipAfter">s before the end</span>
      <small data-i18n="skipHint"></small>
    </label>
  </details>

  <details>
    <summary data-i18n="backup">Backup</summary>
    <textarea id="io" rows="5" data-i18n-placeholder="backupPlaceholder"></textarea>
    <div class="row">
      <button id="export" data-i18n="export">Export</button>
      <button id="import" data-i18n="import">Import (replace)</button>
      <button id="clear" class="danger" data-i18n="clear">Clear list</button>
    </div>
  </details>

  <template id="item-tpl">
    <li draggable="true">
      <span class="handle" data-i18n-title="drag"><span class="icon" data-icon="grip-vertical" aria-hidden="true"></span></span>
      <span class="num"></span>
      <span class="title"></span>
      <span class="actions">
        <button class="up" data-i18n-title="moveUp" data-i18n-aria-label="moveUp"><span class="icon" data-icon="arrow-up" aria-hidden="true"></span></button>
        <button class="down" data-i18n-title="moveDown" data-i18n-aria-label="moveDown"><span class="icon" data-icon="arrow-down" aria-hidden="true"></span></button>
        <button class="edit" data-i18n-title="rename" data-i18n-aria-label="rename"><span class="icon" data-icon="pen" aria-hidden="true"></span></button>
        <button class="del" data-i18n-title="remove" data-i18n-aria-label="remove"><span class="icon" data-icon="xmark" aria-hidden="true"></span></button>
      </span>
    </li>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
